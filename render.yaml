# Render blueprint for the Northstar career-astrology app (astro/).
#
# This does NOT touch the existing ev-bet service. That service was created
# manually in the Render dashboard and keeps using the root Procfile; a
# blueprint only ever affects services you explicitly create from it. The two
# run side by side as separate services off the same repo.
#
# To deploy: Render dashboard -> New -> Blueprint -> pick this repo and the
# branch, then Apply. Set ANTHROPIC_API_KEY on the service afterwards if you
# want the AI reading; without it the app still calculates every chart and
# falls back to its built-in template reader.

services:
  - type: web
    name: northstar-astro
    runtime: python
    plan: free
    branch: claude/career-astrology-app-sgt5t7
    rootDir: astro
    buildCommand: pip install -r requirements.txt
    # One worker, not two. The process holds ~180 MB resident once the city
    # index and timezone dataset are warm, so two workers would sit around
    # 360 MB and risk the OOM killer on the 512 MB free plan. Threads give
    # concurrency instead; a chart takes ~0.5s of CPU, and the ephemeris calls
    # are serialised behind a lock anyway.
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # All of these are set in the dashboard, not here — never commit a key.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Required before the webhook will grant anyone access. With this unset
      # the endpoint fails closed and rejects every event, which is the safe
      # default but means nobody can ever unlock.
      - key: WHOP_WEBHOOK_SECRET
        sync: false
      # Only needed for real checkout: the server creates the checkout
      # configuration that carries the session token into the purchase.
      - key: WHOP_API_KEY
        sync: false
      - key: WHOP_WEEKLY_PLAN_ID
        sync: false
      - key: WHOP_ANNUAL_PLAN_ID
        sync: false
      - key: WHOP_PRODUCT_ID
        sync: false
      # Where the entitlement grants live. On the free plan this is ephemeral
      # (see the disk note below) — it resets whenever the service restarts.
      - key: ASTRO_DB_PATH
        value: /var/data/entitlements.db

    # Persistent storage for the grants table.
    #
    # COMMENTED OUT because Render disks require a Starter instance ($7/mo) —
    # a free service cannot mount one, and Apply will fail with this enabled.
    #
    # On the free plan the service also spins down after ~15 minutes idle, so
    # ASTRO_DB_PATH above is wiped on every restart and redeploy. That is fine
    # for demoing the paywall (re-send the webhook and you are paid again) and
    # NOT fine for real customers, who would silently lose access. Before
    # taking money: upgrade the plan and uncomment this, or move the grants to
    # managed Postgres.
    #
    # disk:
    #   name: northstar-data
    #   mountPath: /var/data
    #   sizeGB: 1
