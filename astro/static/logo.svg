<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Northstar">
  <!-- The chart wheel, its horizon (the Ascendant-Descendant axis), and a fixed
       star at the top of the wheel: the Midheaven, which is the career point.
       A north star you steer by, over the chart it is measured against. -->
  <circle cx="16" cy="16" r="11.5" fill="none" stroke="#1f2a44" stroke-width="1.4"/>
  <line x1="4.5" y1="16" x2="27.5" y2="16" stroke="#1f2a44" stroke-width="1.2" opacity="0.75"/>
  <line x1="16" y1="4.5" x2="16" y2="10" stroke="#1f2a44" stroke-width="1.2" opacity="0.35"/>
  <path d="M16 0.3 L17.41 3.09 L20.2 4.5 L17.41 5.91 L16 8.7 L14.59 5.91 L11.8 4.5 L14.59 3.09 Z" fill="#c1592b"/>
</svg>
