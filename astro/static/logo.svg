<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Transit">
  <!-- The chart wheel, its horizon (the Ascendant-Descendant axis), and a body
       crossing the top of the wheel: the Midheaven, which is the career point.
       That is the whole product in four primitives. -->
  <circle cx="16" cy="16" r="11.5" fill="none" stroke="#1f2a44" stroke-width="1.4"/>
  <line x1="4.5" y1="16" x2="27.5" y2="16" stroke="#1f2a44" stroke-width="1.2" opacity="0.75"/>
  <line x1="16" y1="4.5" x2="16" y2="10" stroke="#1f2a44" stroke-width="1.2" opacity="0.35"/>
  <circle cx="16" cy="4.5" r="3.4" fill="#c1592b"/>
</svg>
